services:
  db:
    image: mariadb:10.11@sha256:5a5c675881ef3fd1c1da9b0a3bfd6ee82edbe39cd9e32e06be18034c37235e0e
    container_name: tmd_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command: >
      --innodb-buffer-pool-size=256M
      --max-connections=100
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: litespeedtech/openlitespeed:latest@sha256:c5ed930004046a15f6191cbd2f1ae9adfc5fceb548259ab27d6a1369ea3dc2ee
    container_name: tmd_ols_wordpress
    restart: unless-stopped
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - wp_data:/var/www/html
      - wp_data:/var/www/vhosts/localhost/html
      - ols_conf:/usr/local/lsws/conf
      - ols_logs:/usr/local/lsws/logs
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:7080:7080"

  phpmyadmin:
    image: phpmyadmin:latest@sha256:7dfd52c452049bf077f5ae6d46324f5f33ea0130c16b958d9821aff5c6f812ef
    container_name: tmd_phpmyadmin
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:8081:80"

volumes:
  db_data:
    external: true
    name: pagetmd_v3_db_data
  wp_data:
    external: true
    name: pagetmd_v3_wp_data
  ols_conf:
    external: true
    name: pagetmd_v3_ols_conf
  ols_logs:
    external: true
    name: pagetmd_v3_ols_logs
