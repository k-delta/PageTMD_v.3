name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy selected commit
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_SSH_USER }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "/opt/tecnimontacargas/app/scripts/deploy-production.sh '${TARGET_SHA}'"
